name: docs

# Optional documentation validation. Publication is built locally on gh-pages.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + docs deps
        run: pip install -e ".[docs]"

      - name: Build HTML
        run: sphinx-build -W -b html docs docs/_build/html
