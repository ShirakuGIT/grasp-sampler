[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-sampler"
version = "0.1.0"
description = "A simple, mesh-based parallel-jaw grasp sampler"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "trimesh>=3.20",
    "scipy>=1.7",
    "rtree>=1.0",
    "open3d>=0.18",
]

[project.optional-dependencies]
viz = ["pyglet<2"]                          # interactive trimesh viewer
robust-viz = ["matplotlib>=3.5"]            # interactive uncertainty viewer
sim = ["pybullet>=3.2", "imageio>=2.9"]     # pybullet collision filter + viewer
fr3 = ["xacro>=2.0", "pyyaml>=6", "pycollada>=0.9"] # official FR3v2 model preparation
mujoco = ["mujoco>=3.6", "Pillow>=9"]      # native viewer + original scan textures
asset-prep = ["coacd==1.0.14", "Pillow>=9"] # offline household contact decomposition
mplib = ["mplib>=0.2"]                     # MPlib / SAPIEN pose targets
docs = ["sphinx>=7.0", "myst-parser>=2.0", "furo>=2024.1"]
dev = ["pytest>=7.0", "ruff>=0.4", "vulture>=2.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Terse one-line test setup and example CLI argument lists read better unwrapped.
"tests/*" = ["E501", "E702"]
"examples/*" = ["E501", "E702"]

[tool.vulture]
paths = ["src", "tests", "examples", "tools", "vulture_whitelist.py"]
min_confidence = 60
